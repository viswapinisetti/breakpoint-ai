name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No API key is set anywhere in CI. Every suite below runs offline against
  # pre-generated content; anything needing a provider (generation, evidence
  # evaluation, debate, live debrief) is out of scope for an automated run and
  # would spend money on every push.
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches local development (3.14.6). The sandbox child process and
          # the restricted-builtins allowlist are version-sensitive, so this
          # is pinned to a minor rather than left floating.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: |
          pytest -m "not lint" \
                 --cov=app --cov-report=term-missing --cov-report=xml \
                 --junitxml=junit.xml

      # Authoring style warnings are advisory: they should be visible without
      # blocking a merge, which is why they are a separate marked run.
      - name: Authoring lint (advisory)
        working-directory: backend
        continue-on-error: true
        run: pytest -m lint -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/junit.xml
            backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 LTS, matching the container build documented in the README.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # harness_test.py is CPython, not node - the frontend job needs both.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      # These run under plain node and CPython - no browser needed. The Python
      # harness is the same file the Pyodide worker loads, tested under real
      # CPython so the two cannot drift.
      - name: Sandbox and tool tests
        working-directory: frontend
        run: |
          node src/lib/calc.test.mjs
          node src/lib/sql/prepare.test.mjs
          node src/lib/code/plan.test.mjs
          python src/lib/code/harness_test.py
