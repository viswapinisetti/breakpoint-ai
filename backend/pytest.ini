[pytest]
testpaths = tests
pythonpath = .

# Content validity and the lint pass are separate concerns: a style warning
# should never block a merge on its own, so lint is marked and deselectable.
#   pytest                          -> everything
#   pytest -m "not lint"            -> gate only
#   pytest tests/test_content.py -k apt-pct-001
markers =
    lint: authoring style warnings, non-blocking

# Quiet, but name the failing case. Short tracebacks because the useful
# information is in the assertion message, not the stack.
addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    ignore::DeprecationWarning
